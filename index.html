<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactieve Kaart</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Interactieve Kaart</h1>
      <input id="search" type="text" placeholder="Zoek een plaats..." />
      <button id="search-btn">Zoek</button>
      <select id="layer">
        <option value="osm">Standaard</option>
        <option value="topo">Topografisch</option>
        <option value="satellite">Satelliet</option>
      </select>
      <button id="locate">Mijn locatie</button>
      <button id="add-point" aria-pressed="false">Voeg punt toe</button>
      <button id="clear">Wis markers</button>
    </header>
    <div id="map"></div>
    <div class="coord-badge" id="coords">Beweeg over de kaart</div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="app.js"></script>
</body>
</html>

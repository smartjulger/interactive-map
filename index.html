<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactieve Kaart</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, sans-serif; }
    #app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
    header {
      background: #1f2937; color: #fff; padding: 0.75rem 1rem;
      display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;
    }
    header h1 { font-size: 1.1rem; margin: 0; flex: 1; }
    header input, header button, header select {
      padding: 0.45rem 0.7rem; border-radius: 6px; border: 1px solid #374151;
      background: #111827; color: #fff; font-size: 0.9rem;
    }
    header button { cursor: pointer; background: #2563eb; border-color: #2563eb; }
    header button:hover { background: #1d4ed8; }
    #map { width: 100%; height: 100%; }
    .legend {
      background: #fff; padding: 0.5rem 0.75rem; border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2); font-size: 0.85rem; line-height: 1.4;
    }
    .legend strong { display: block; margin-bottom: 0.25rem; }
    .coord-badge {
      position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
      background: rgba(31, 41, 55, 0.9); color: #fff; padding: 0.35rem 0.75rem;
      border-radius: 999px; font-size: 0.8rem; z-index: 500; pointer-events: none;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>
      <h1>Interactieve Kaart</h1>
      <input id="search" type="text" placeholder="Zoek een plaats..." />
      <button id="search-btn">Zoek</button>
      <select id="layer">
        <option value="osm">Standaard</option>
        <option value="topo">Topografisch</option>
        <option value="satellite">Satelliet</option>
      </select>
      <button id="locate">Mijn locatie</button>
      <button id="clear">Wis markers</button>
    </header>
    <div id="map"></div>
    <div class="coord-badge" id="coords">Beweeg over de kaart</div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map('map', { zoomControl: true }).setView([52.3676, 4.9041], 6);

    const layers = {
      osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
      }),
      topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data: &copy; OpenStreetMap, SRTM | Style: &copy; OpenTopoMap (CC-BY-SA)',
        maxZoom: 17,
      }),
      satellite: L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        { attribution: 'Tiles &copy; Esri', maxZoom: 19 }
      ),
    };
    layers.osm.addTo(map);
    let activeLayer = layers.osm;

    const poi = [
      { name: 'Amsterdam', coords: [52.3676, 4.9041], info: 'Hoofdstad van Nederland' },
      { name: 'Rotterdam', coords: [51.9244, 4.4777], info: 'Grootste haven van Europa' },
      { name: 'Den Haag', coords: [52.0705, 4.3007], info: 'Regeringszetel' },
      { name: 'Utrecht', coords: [52.0907, 5.1214], info: 'Historisch centrum met de Dom' },
      { name: 'Eindhoven', coords: [51.4416, 5.4697], info: 'Technologie- en designstad' },
      { name: 'Groningen', coords: [53.2194, 6.5665], info: 'Studentenstad in het noorden' },
      { name: 'Maastricht', coords: [50.8514, 5.6910], info: 'Bourgondische stad in Limburg' },
    ];

    const markerLayer = L.layerGroup().addTo(map);
    poi.forEach(p => {
      L.marker(p.coords)
        .bindPopup(`<strong>${p.name}</strong><br/>${p.info}`)
        .addTo(markerLayer);
    });

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = () => {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = '<strong>Legenda</strong>Klik op een marker voor info.<br/>Klik op de kaart om een marker toe te voegen.';
      return div;
    };
    legend.addTo(map);

    const coordsEl = document.getElementById('coords');
    map.on('mousemove', e => {
      coordsEl.textContent = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
    });

    const userMarkers = L.layerGroup().addTo(map);
    map.on('click', e => {
      L.marker(e.latlng, { opacity: 0.8 })
        .bindPopup(`Eigen marker<br/>${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`)
        .addTo(userMarkers)
        .openPopup();
    });

    document.getElementById('clear').addEventListener('click', () => userMarkers.clearLayers());

    document.getElementById('layer').addEventListener('change', e => {
      map.removeLayer(activeLayer);
      activeLayer = layers[e.target.value];
      activeLayer.addTo(map);
    });

    document.getElementById('locate').addEventListener('click', () => {
      map.locate({ setView: true, maxZoom: 13 });
    });
    map.on('locationfound', e => {
      L.circleMarker(e.latlng, { radius: 8, color: '#2563eb', fillOpacity: 0.6 })
        .bindPopup('Je bent hier')
        .addTo(userMarkers)
        .openPopup();
    });
    map.on('locationerror', () => alert('Locatie kon niet worden bepaald.'));

    async function search(query) {
      if (!query.trim()) return;
      const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`;
      const res = await fetch(url, { headers: { 'Accept-Language': 'nl' } });
      const data = await res.json();
      if (!data.length) { alert('Niets gevonden.'); return; }
      const { lat, lon, display_name } = data[0];
      const latlng = [parseFloat(lat), parseFloat(lon)];
      map.setView(latlng, 12);
      L.marker(latlng).bindPopup(display_name).addTo(userMarkers).openPopup();
    }
    document.getElementById('search-btn').addEventListener('click', () => {
      search(document.getElementById('search').value);
    });
    document.getElementById('search').addEventListener('keydown', e => {
      if (e.key === 'Enter') search(e.target.value);
    });
  </script>
</body>
</html>
